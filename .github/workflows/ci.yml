name: CI

on:
  push:
    branches: [main,develop]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -- Go: vet, test, lint --
  go:
    name: Go vet & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt

  # -- golangci-lint --
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # -- gosec (SAST scan) --
  security:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    permissions:
      # code scanning upload (codeql-action/upload-sarif): security-events
      # for the SARIF upload, actions to read the workflow run it queries
      # while adding fingerprints (otherwise the API call fails with
      # "Resource not accessible by integration").
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # Note: do not use -quiet here: it suppresses the report output
      # entirely, including the -out SARIF file (the file is then never
      # written and the upload step below fails).
      - name: Run gosec
        run: |
          "$(go env GOPATH)/bin/gosec" -fmt=sarif -out=results.sarif ./...

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        # Skipped for fork PRs: their GITHUB_TOKEN is read-only and the
        # upload would fail (the gosec scan itself still gates the job).
        if: always() && github.event.pull_request.head.repo.fork == false
        with:
          sarif_file: results.sarif

  # -- Helm lint & package --
  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm dependency update
        run: helm dependency update charts/codx

      - name: Helm lint
        run: helm lint charts/codx

      - name: Helm template (render check)
        run: |
          helm template codx charts/codx \
            --set oidc.issuer=https://keycloak.example.com/realms/codx \
            --set oidc.clientId=codx \
            --set oidc.clientSecret=secret \
            --set oidc.redirectUrl=https://codx.example.com/auth/callback \
            --set redis.host=valkey:6379 \
            --set ingress.host=codx.example.com \
            > /dev/null

      - name: Helm package
        run: helm package charts/codx --destination dist/

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.0

      - name: Push and sign Helm chart (OCI)
        if: github.event_name != 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          chart=$(ls dist/*.tgz)
          name=$(helm show chart "$chart" | sed -n 's/^name:[[:space:]]*//p')
          version=$(helm show chart "$chart" | sed -n 's/^version:[[:space:]]*//p')
          owner="${OWNER,,}"
          helm push "$chart" "oci://${REGISTRY}/${owner}/charts"
          cosign sign --yes "${REGISTRY}/${owner}/charts/${name}:${version}"

  # -- Docker build, CVE scan & push --
  docker:
    name: Docker build, scan & push
    runs-on: ubuntu-latest
    needs: [go, lint, security, helm]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Build a single-arch image for the CVE scan: the image is scanned
      # before it is pushed, so a vulnerable build never reaches the
      # registry. The layers are shared with the multi-arch build below
      # through the GHA cache.
      - name: Build image (amd64) for CVE scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/codx-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/codx-image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # SBOM of the same image (amd64 tar): the package inventory of the
      # distroless base plus the Go modules embedded in the static binary.
      - name: Generate SBOM (Trivy, CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/codx-image.tar
          format: cyclonedx
          output: sbom.cyclonedx.json
          scanners: vuln

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign images with cosign
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r image; do
            cosign sign --yes "$image"
          done

      # Attach the SBOM to the pushed image as a cosign attestation, so the
      # SBOM travels with the image in the registry (verifiable with
      # `cosign attest verify`). Generated from the amd64 build; the
      # package inventory is equivalent across architectures.
      - name: Attach SBOM to the image (cosign attest)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r image; do
            cosign attest --yes --type cyclonedx --predicate sbom.cyclonedx.json "$image"
          done
