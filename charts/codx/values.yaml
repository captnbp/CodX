# CodX Helm Chart Values
## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
## Current available global Docker image parameters: imageRegistry, imagePullSecrets and storageClass

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array. Also used as the fallback image pull secrets of workspace pods whose Profile does not set podSpec.imagePullSecrets.
## @param global.storageClass Global StorageClass for Persistent Volume(s)
##
global:
  imageRegistry: ""
  ## e.g.
  ## imagePullSecrets:
  ##   - myRegistryKeySecretName
  ##
  imagePullSecrets: []
  storageClass: ""

## @section Common parameters

## @param nameOverride String to partially override common.names.fullname template (will maintain the release name)
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname template
##
fullnameOverride: ""
## @param instanceName CodX instance name used to build workspace object names (<instance>-<slug> for Services, PVCs, Certificates, Pods) and the app.kubernetes.io/managed-by label. Defaults to the chart fullname when empty.
##
instanceName: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param kubeVersion Force target Kubernetes version (using Helm capabilities if not set)
##
kubeVersion: ""
## @param clusterDomain Default Kubernetes cluster domain
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []

## Diagnostic mode
## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
## @param diagnosticMode.command Command to override all containers in the chart release
## @param diagnosticMode.args Args to override all containers in the chart release
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section codx parameters

## codx image version
## ref: https://hub.docker.com/r/bitnami/codx/tags/
## @param image.registry codx image registry
## @param image.repository codx image repository
## @param image.tag codx image tag (immutable tags are recommended)
## @param image.pullPolicy Image pull policy
## @param image.pullSecrets Specify docker-registry secret names as an array
## @param image.debug Specify if debug logs should be enabled
##
image:
  registry: ghcr.io
  repository: "captnbp/codx"
  tag: main
  ## Specify a imagePullPolicy
  ## Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []
  ## Set to true if you would like to see extra information on logs
  ##
  debug: false

## @param extraEnvVars [object] Extra environment variables to be set on codx container
## e.g:
## extraEnvVars:
##   - name: FOO
##     value: "bar"
##
extraEnvVars: []

## @param extraEnvVarsCM ConfigMap with extra environment variables
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Secret with extra environment variables
##
extraEnvVarsSecret: ""
## @param command Default container command (useful when using custom images). Use array form
##
command: []
## @param args Default container args (useful when using custom images). Use array form
##
args: []

## @section codx deployment/statefulset parameters

## @param schedulerName Specifies the schedulerName, if it's nil uses kube-scheduler
## https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
##
schedulerName: ""

## @param updateStrategy.type codxwarden statefulset strategy type
## @param updateStrategy.rollingUpdate codxwarden statefulset rolling update configuration parameters
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
##
updateStrategy:
  type: RollingUpdate
  rollingUpdate: {}

## @param hostAliases codx pod host aliases
## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
##
hostAliases: []
## @param containerPorts.https codx container port to open for codx https
##
containerPorts:
  https: 8443
## codx pod Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
## @param podSecurityContext.enabled Enable pod Security Context
## @param podSecurityContext.fsGroup Group ID for the container
## @param podSecurityContext.seccompProfile.type Type of seccomp profile to use
##
podSecurityContext:
  enabled: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
## codx container Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param containerSecurityContext.enabled Enable container Security Context
## @param containerSecurityContext.runAsUser User ID for the container
## @param containerSecurityContext.runAsNonRoot Avoid running as root User
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation
## @param containerSecurityContext.readOnlyRootFilesystem Read-only root filesystem
## @param containerSecurityContext.capabilities.drop Capabilities to drop
## @param containerSecurityContext.capabilities.add Capabilities to add
##
containerSecurityContext:
  enabled: true
  runAsUser: 65532
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add: []
## @param podLabels Extra labels for codx pods
## Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
##
podLabels: {}
## @param podAnnotations Annotations for codx pods
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
##
podAnnotations: {}
## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAffinityPreset: ""
## @param podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAntiAffinityPreset: soft
## Node affinity preset
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
##
nodeAffinityPreset:
  ## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
  ##
  type: ""
  ## @param nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set.
  ## E.g.
  ## key: "kubernetes.io/e2e-az-name"
  ##
  key: ""
  ## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
  ## E.g.
  ## values:
  ##   - e2e-az1
  ##   - e2e-az2
  ##
  values: []
## @param affinity Affinity for pod assignment. Evaluated as a template.
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## Note: podAffinityPreset, podAntiAffinityPreset, and nodeAffinityPreset will be ignored when it's set
##
affinity: {}
## @param nodeSelector Node labels for pod assignment. Evaluated as a template.
## ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: {}
## @param tolerations Tolerations for pod assignment. Evaluated as a template.
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
tolerations: []
## @param topologySpreadConstraints Topology Spread Constraints for codx pods assignment spread across your cluster among failure-domains
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#spread-constraints-for-pods
##
topologySpreadConstraints: []
## @param priorityClassName codx pods' priorityClassName
##
priorityClassName: ""
## codx containers' resource requests and limits
## ref: http://kubernetes.io/docs/user-guide/compute-resources/
## We usually recommend not to specify default resources and to leave this as a conscious
## choice for the user. This also increases chances charts run on environments with little
## resources, such as Minikube. If you do want to specify resources, uncomment the following
## lines, adjust them as necessary, and remove the curly braces after 'resources:'.
## @param resources.limits The resources limits for the codx container
## @param resources.requests The requested resources for the codx container
##
resources:
  ## Example:
  ## limits:
  ##    cpu: 250m
  ##    memory: 256Mi
  limits: {}
  ## Examples:
  ## requests:
  ##    cpu: 250m
  ##    memory: 256Mi
  requests: {}

# -- Number of CodX replicas (scalable, sessions shared via Redis)
## @param replicas Number of CodX replicas
##
replicas: 1

## @section Exposure parameters
##

## Service configuration
##
service:
  ## @param service.type Kubernetes service type
  ##
  type: ClusterIP
  ## @param service.ports.https codx service HTTPS port
  ##
  ports:
    https: 8443
  ## @param service.nodePorts [object] Specify the nodePort values for the LoadBalancer and NodePort service types.
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport
  ##
  nodePorts:
    https: ""
  ## @param service.sessionAffinity Control where client requests go, to the same pod or round-robin
  ## Values: ClientIP or None
  ## ref: https://kubernetes.io/docs/user-guide/services/
  ##
  sessionAffinity: None
  ## @param service.sessionAffinityConfig Additional settings for the sessionAffinity
  ## sessionAffinityConfig:
  ##   clientIP:
  ##     timeoutSeconds: 300
  ##
  sessionAffinityConfig: {}
  ## @param service.clusterIP codx service clusterIP IP
  ## e.g:
  ## clusterIP: None
  ##
  clusterIP: ""
  ## @param service.loadBalancerIP loadBalancerIP for the SuiteCRM Service (optional, cloud specific)
  ## ref: https://kubernetes.io/docs/user-guide/services/#type-loadbalancer
  ##
  loadBalancerIP: ""
  ## @param service.loadBalancerSourceRanges Address that are allowed when service is LoadBalancer
  ## https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
  ## Example:
  ## loadBalancerSourceRanges:
  ##   - 10.10.10.0/24
  ##
  loadBalancerSourceRanges: []
  ## @param service.externalTrafficPolicy Enable client source IP preservation
  ## ref https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  ##
  externalTrafficPolicy: Cluster
  ## @param service.annotations Additional custom annotations for codx service
  ##
  annotations: {}
  ## @param service.extraPorts Extra port to expose on codx service
  ##
  extraPorts: []
  ## @param service.extraHeadlessPorts Extra ports to expose on codx headless service
  ##
  extraHeadlessPorts: []
  ## @param service.ipFamilyPolicy Controller Service ipFamilyPolicy (optional, cloud specific)
  ## This can be either SingleStack, PreferDualStack or RequireDualStack
  ## ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/#services
  ##
  ipFamilyPolicy: "PreferDualStack"
  ## @param service.ipFamilies Controller Service ipFamilies (optional, cloud specific)
  ## This can be either ["IPv4"], ["IPv6"], ["IPv4", "IPv6"] or ["IPv6", "IPv4"]
  ## ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/#services
  ##
  ipFamilies: ["IPv6", "IPv4"]


## codx ingress parameters
## ref: http://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  ## @param ingress.enabled Enable ingress record generation for codx
  ##
  enabled: true
  ## @param ingress.pathType Ingress path type
  ##
  pathType: ImplementationSpecific
  ## @param ingress.apiVersion Force Ingress API version (automatically detected if not set)
  ##
  apiVersion: ""
  ## @param ingress.hostname Default host for the ingress record
  ##
  hostname: codx.local
  ## @param ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ##
  ingressClassName: "traefik"
  ## @param ingress.ingressControllerType ingressControllerType that will be be used to implement the Ingress specific annotations (Ex. nginx or traefik)
  ingressControllerType: "traefik"
  ## @param ingress.path Default path for the ingress record
  ## NOTE: You may need to set this to '/*' in order to use this with ALB ingress controllers
  ##
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  ## Use this parameter to set the required annotations for cert-manager, see
  ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   cert-manager.io/cluster-issuer: cluster-issuer-name
  ##
  annotations: {}
  ## @param ingress.extraMiddlewares [array] Extra Traefik middlewares appended to the traefik.ingress.kubernetes.io/router.middlewares annotation, after any user-defined middlewares and the chart passTLSClientCert middleware (when traefikMtls.enabled). Entries are middleware references; the "@kubernetescrd" provider suffix is added when missing.
  ## e.g:
  ## extraMiddlewares:
  ##   - my-middleware
  ##   - traefik-my-other-middleware@kubernetescrd
  ##
  extraMiddlewares: []
  ## @param ingress.tls Enable TLS configuration for the host defined at `ingress.hostname` parameter
  ## TLS certificates will be retrieved from a TLS secret with name: `{{- printf "%s-tls" .Values.ingress.hostname }}`
  ## You can:
  ##   - Use the `ingress.secrets` parameter to create this TLS secret
  ##   - Rely on cert-manager to create it by setting the corresponding annotations
  ##   - Rely on Helm to create self-signed certificates by setting `ingress.selfSigned=true`
  ##
  tls: false
  ## @param ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates generated by Helm
  ##
  selfSigned: false
  ## @param ingress.extraHosts An array with additional hostname(s) to be covered with the ingress record
  ## e.g:
  ## extraHosts:
  ##   - name: codx.local
  ##     path: /
  ##
  extraHosts: []
  ## @param ingress.extraPaths An array with additional arbitrary paths that may need to be added to the ingress under the main host
  ## e.g:
  ## extraPaths:
  ## - path: /*
  ##   backend:
  ##     serviceName: ssl-redirect
  ##     servicePort: use-annotation
  ##
  extraPaths: []
  ## @param ingress.extraTls TLS configuration for additional hostname(s) to be covered with this ingress record
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  ## e.g:
  ## extraTls:
  ## - hosts:
  ##     - codx.local
  ##   secretName: codx.local-tls
  ##
  extraTls: []
  ## @param ingress.secrets Custom TLS certificates as secrets
  ## NOTE: 'key' and 'certificate' are expected in PEM format
  ## NOTE: 'name' should line up with a 'secretName' set further up
  ## If it is not set and you're using cert-manager, this is unneeded, as it will create a secret for you with valid certificates
  ## If it is not set and you're NOT using cert-manager either, self-signed certificates will be created valid for 365 days
  ## It is also possible to create and manage the certificates outside of this helm chart
  ## Please see README.md for more information
  ## e.g:
  ## secrets:
  ##   - name: codx.local-tls
  ##     key: |-
  ##       -----BEGIN RSA PRIVATE KEY-----
  ##       ...
  ##       -----END RSA PRIVATE KEY-----
  ##     certificate: |-
  ##       -----BEGIN CERTIFICATE-----
  ##       ...
  ##       -----END CERTIFICATE-----
  ##
  secrets: []
  ## @param ingress.extraRules Additional rules to be covered with this ingress record
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules
  ## e.g:
  ## extraRules:
  ## - host: example.local
  ##     http:
  ##       path: /
  ##       backend:
  ##         service:
  ##           name: example-svc
  ##           port:
  ##             name: http
  ##
  extraRules: []

## @section RBAC parameter
## Specifies whether a ServiceAccount should be created
##
serviceAccount:
  ## @param serviceAccount.create Enable the creation of a ServiceAccount for codxwarden pods
  ##
  create: true
  ## @param serviceAccount.name Name of the created ServiceAccount
  ## If not set and create is true, a name is generated using the fullname template
  ##
  name: ""
  ## @param serviceAccount.automountServiceAccountToken Auto-mount the service account token in the pod
  ##
  automountServiceAccountToken: true
  ## @param serviceAccount.annotations Additional custom annotations for the ServiceAccount
  ##
  annotations: {}

## @section Global TLS settings for internal CA
##
tls:
  ## @param tls.enabled Enable internal TLS between Ingress controller and unifi
  enabled: true
  ## @param tls.autoGenerated Create cert-manager signed TLS certificates.
  ##
  autoGenerated: true

  ## @param tls.existingSecret Existing secret containing the certificates for Unifi
  ##
  existingSecret: ""
  ## Base subject details for certificate generation, node_dn filtering, admin_dn 
  ##
  subject:
    ## @param tls.subject.organizationalUnits Subject's organizational units
    ##
    organizationalUnits: "codx"
    ## @param tls.subject.organizations Subject's organization
    ##
    organizations: "codx"
    ## @param tls.subject.countries Subject's country
    ##
    countries: "fr"
  issuerRef:
    ## @param tls.issuerRef.existingIssuerName Existing name of the cert-manager http issuer. If provided, it won't create a default one.
    ##
    existingIssuerName: ""
    ## @param tls.issuerRef.kind Kind of the cert-manager issuer resource (defaults to "Issuer")
    ##
    kind: "Issuer"
    ## @param tls.issuerRef.group Group of the cert-manager issuer resource (defaults to "cert-manager.io")
    ##
    group: "cert-manager.io"
  # -- TLS paths in the CodX pod
  ## @param tls.serverCertDir Directory where the CodX server certificate is mounted (from cert-manager)
  serverCertDir: /tls
  ## @param tls.clientCertDir Directory where the CodX client certificate is mounted (from cert-manager)
  clientCertDir: /tls/client
  ## @param tls.caDir Directory where the CA certificate is mounted (from cert-manager)
  caDir: /tls

valkey:
  ## @param valkey.enabled Enable Valkey integration for CodX
  ##
  enabled: false
  ## @param valkey.resources Resources for the Valkey container
  ##
  resources: {}
  ## Persistent storage configuration (standalone deployment only)
  ##
  dataStorage:
    ## @param valkey.dataStorage.enabled Enable persistent volume claim creation
    ##
    enabled: false
    ## @param valkey.dataStorage.persistentVolumeClaimName Use an existing PVC by name (skip dynamic provisioning if set)
    ##
    persistentVolumeClaimName: ""
    ## @param valkey.dataStorage.subPath Subpath inside the PVC to mount
    ##
    subPath: ""
    ## @param valkey.dataStorage.volumeName Name of the volume (referenced in the deployment)
    ##
    volumeName: "valkey-data"
    ## @param valkey.dataStorage.requestedSize Request size (e.g. 5Gi) for a dynamically provisioned volume
    ##
    requestedSize: ""
    ## @param valkey.dataStorage.className Name of the storage class to use
    ##
    className: ""
  ## @param valkey.valkeyConfig Content for valkey.conf (mounted via ConfigMap)
  ##
  valkeyConfig: ""

  auth:
    ## @param valkey.auth.enabled Enable ACL-based authentication.
    ## IMPORTANT: When authentication is enabled, the 'default' user MUST be defined in either
    ## aclUsers or aclConfig. Without a default user, anyone can access the database without
    ## credentials, creating a security risk.
    ##
    enabled: false

    ## @param valkey.auth.usersExistingSecret Use an existing secret for user passwords. Key defaults to username.
    ## Supports templating, e.g.: "users-{{ .Release.Name }}"
    ##
    usersExistingSecret: ""

    ## @param valkey.auth.aclUsers [object] Map of users to create with ACL permissions.
    ## If usersExistingSecret is set, passwords from the secret take priority over inline passwords.
    ## NOTE: If using aclUsers, the 'default' user must be included here.
    ##
    aclUsers: {}
    # Example:
    # default:
    #   permissions: "~* &* +@all"
    #   password: "secretpass"        # Inline password (fallback if usersExistingSecret not set)
    #   passwordKey: "admin-pwd"      # Key in usersExistingSecret (defaults to username)
    # read-user:
    #   permissions: "~* -@all +@read +ping +info"

    ## @param valkey.auth.aclConfig Inline ACL configuration that will be appended after the generated users.
    ## NOTE: If using aclConfig, ensure the 'default' user is defined here.
    ##
    aclConfig: ""
    # Example:
    # aclConfig: |
    #   user default on >secretpass ~* &* +@all

  ## Replica configuration for master-replica replication mode
  ##
  replica:
    ## @param valkey.replica.enabled Enable master-replica replication mode
    ##
    enabled: false

  tls:
    ## @param valkey.tls.enabled Enable TLS
    ##
    enabled: true
    ## @param valkey.tls.existingSecret Name of the Secret containing the TLS keys (required)
    ##
    existingSecret: "codx-valkey-tls"
    ## @param valkey.tls.serverPublicKey Secret key name containing the server public certificate
    ##
    serverPublicKey: tls.crt
    ## @param valkey.tls.serverKey Secret key name containing the server private key
    ##
    serverKey: tls.key
    ## @param valkey.tls.caPublicKey Secret key name containing the Certificate Authority public certificate
    ##
    caPublicKey: ca.crt
    ## @param valkey.tls.requireClientCertificate Require that clients authenticate with a certificate
    ##
    requireClientCertificate: false

  metrics:
    ## @param valkey.metrics.enabled Enable the Prometheus exporter sidecar
    ##
    enabled: true
    ## Exporter configuration
    ##
    exporter:
      ## @param valkey.metrics.exporter.resources Resources for the Valkey Prometheus exporter container
      ## Example:
      ## limits:
      ##   cpu: 100m
      ##   memory: 128Mi
      ## requests:
      ##   cpu: 100m
      ##   memory: 128Mi
      ##
      resources: {}
      ## @param valkey.metrics.exporter.extraEnvs [object] Extra environment variables for the Valkey Prometheus exporter container
      ## Example:
      ## LOG_LEVEL: info
      ##
      extraEnvs: {}
      securityContext:
        ## @param valkey.metrics.exporter.securityContext.runAsNonRoot Run the Valkey Prometheus exporter as a non-root user
        ##
        runAsNonRoot: true
        ## @param valkey.metrics.exporter.securityContext.runAsUser User ID for the Valkey Prometheus exporter container
        ##
        runAsUser: 1000
        ## @param valkey.metrics.exporter.securityContext.runAsGroup Group ID for the Valkey Prometheus exporter container
        ##
        runAsGroup: 1000
        capabilities:
          ## @param valkey.metrics.exporter.securityContext.capabilities.drop [array] Capabilities to drop for the Valkey Prometheus exporter container
          ##
          drop:
            - ALL
        ## @param valkey.metrics.exporter.securityContext.readOnlyRootFilesystem Read-only root filesystem for the Valkey Prometheus exporter container
        ##
        readOnlyRootFilesystem: true

    serviceMonitor:
      ## @param valkey.metrics.serviceMonitor.enabled Create a ServiceMonitor resource for scraping service metrics
      ##
      enabled: true

    podMonitor:
      ## @param valkey.metrics.podMonitor.enabled Create a PodMonitor resource for scraping pod metrics
      ##
      enabled: false

    ## PrometheusRule configuration for alerting rules (used by kube-prometheus-stack)
    ##
    prometheusRule:
      ## @param valkey.metrics.prometheusRule.enabled Enable creation of the PrometheusRule resource
      ##
      enabled: false
      ## @param valkey.metrics.prometheusRule.extraLabels Extra labels to add to the PrometheusRule resource
      ##
      extraLabels: {}
      ## @param valkey.metrics.prometheusRule.extraAnnotations Extra annotations to add to the PrometheusRule resource
      ##
      extraAnnotations: {}
      ## @param valkey.metrics.prometheusRule.rules [array] List of Prometheus alerting rules
      ## Example:
      ## - alert: ValkeyDown
      ##   annotations:
      ##     summary: Valkey instance {{ "{{ $labels.instance }}" }} down
      ##     description: Valkey instance {{ "{{ $labels.instance }}" }} is down.
      ##   expr: |
      ##     redis_up{service="{{ include "valkey.fullname" . }}-metrics"} == 0
      ##   for: 2m
      ##   labels:
      ##     severity: error
      ##
      rules: []

## @section Cert Manager
## CertManager configures how per-user workspace certificates are issued.
## @param certManager.renewal Certificate renewal period before expiry (Go duration, e.g. 720h).
## @param certManager.validity Certificate validity duration (Go duration, e.g. 2160h).
##
certManager:
  renewal: 720h
  validity: 2160h

## @section CodX HTTP Server
## HTTP configures the CodX HTTP server.
## @param http.listenAddr Address the HTTP server binds to. Supports IPv4 (e.g. 0.0.0.0:8443), IPv6 (e.g. [::]:8443) and dual-stack.
## @param http.tlsCertFile Path to the TLS certificate for the CodX server (TLS is mandatory).
## @param http.tlsKeyFile Path to the TLS key for the CodX server (TLS is mandatory).
##
http:
  listenAddr: "[::]:8443"
  tlsCertFile: /tls/tls.crt
  tlsKeyFile: /tls/tls.key

## @section Metrics parameters
## Prometheus metrics served on a dedicated endpoint.
## @param metrics.enabled Enable the dedicated Prometheus /metrics endpoint (configured via the CodX ConfigMap)
## @param metrics.port Port of the dedicated metrics endpoint
## @param metrics.tls Enable TLS on the metrics endpoint using the CodX server certificate (configured via the CodX ConfigMap)
## @param metrics.serviceMonitor.enabled Create a ServiceMonitor resource for Prometheus Operator
## @param metrics.serviceMonitor.interval Scrape interval for the ServiceMonitor
## @param metrics.serviceMonitor.scrapeTimeout Scrape timeout for the ServiceMonitor
## @param metrics.serviceMonitor.labels Extra labels for the ServiceMonitor resource
##
metrics:
  enabled: true
  port: 9443
  tls: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    # Extra labels to add to the ServiceMonitor resource, e.g:
    # release: kube-prometheus-stack

## @section Grafana dashboards
## GrafanaDashboards creates a ConfigMap with a "CodX / Workspaces" dashboard:
## pod-level CPU, memory and network metrics of the workspace pods (modeled
## on the kube-prometheus-stack "Kubernetes / Compute Resources / Pod"
## dashboard, without the per-container breakdown), with a Namespace
## multi-select variable and a filter to show one user workspace or all of
## them, plus the CodX server gauges (running and pending workspaces,
## health). Workspaces are listed from kube_pod_info by pod name prefix
## (<instance>-<slug>, excluding the chart's valkey pods): no kube_pod_labels
## or custom pod labels are required. Requires kubelet/cAdvisor and
## kube-state-metrics (core metrics only) and the Grafana sidecar
## (grafana.sidecar.dashboards enabled), which watches all namespaces by
## default.
## @param grafanaDashboards.enabled Create the ConfigMap with the workspaces dashboard.
## @param grafanaDashboards.label Label key watched by the Grafana dashboard sidecar (kube-prometheus-stack default: grafana_dashboard).
## @param grafanaDashboards.folder Grafana folder imported by the sidecar (grafana_folder label).
## @param grafanaDashboards.annotations Annotations for the dashboard ConfigMap.
##
grafanaDashboards:
  enabled: false
  label: grafana_dashboard
  folder: CodX
  annotations: {}

## @section OIDC Authentication
## OIDC configures the OIDC authentication provider.
## @param oidc.issuer OIDC issuer URL (e.g. https://keycloak.example.com/realms/myrealm).
## @param oidc.clientId OAuth2 client ID registered with the OIDC provider.
## @param oidc.clientSecret OAuth2 client secret. Can also be set via the CODX_OIDC_CLIENT_SECRET environment variable.
## @param oidc.groupClaimName Name of the custom claim in the ID token that contains the user's group memberships.
## @param oidc.adminGroup OIDC group whose members get admin privileges.
## @param oidc.usernameClaimName ID token claim used as the username source for slug generation.
##
oidc:
  issuer: ""
  clientId: ""
  clientSecret: ""
  groupClaimName: groups
  adminGroup: codx-admins
  usernameClaimName: preferred_username

## @section Session
## Session configures the lifetime of user sessions, for both OIDC logins and
## mTLS fallback logins. The TTL drives the server-side session expiry, the
## session store (Redis/Valkey) key expiry and the session cookie MaxAge.
## @param session.ttl How long a session stays valid after login (Go duration, e.g. 12h, 8h, 30m).
##
session:
  ttl: 12h

## @section mTLS Fallback Authentication
## AuthFallback enables a client-certificate (mTLS) fallback that grants admin
## access when the OIDC provider is unavailable. The ingress must request and
## validate client certificates (Traefik TLSOption) and forward the certificate
## information to CodX (Traefik passTLSClientCert middleware, which sets the
## X-Forwarded-Tls-Client-Cert-Info header). CodX matches the forwarded
## certificate Common Name against the adminCns allow list.
## @param authFallback.enabled Enable the mTLS client-certificate fallback authentication for admins.
## @param authFallback.headerName HTTP header carrying the escaped client certificate information.
## @param authFallback.adminCns Client certificate Common Names allowed to authenticate as admins via the fallback.
##
authFallback:
  enabled: false
  headerName: X-Forwarded-Tls-Client-Cert-Info
  adminCns: []
  # Example:
  # adminCns:
  #   - alice

## @section Traefik mTLS objects
## TraefikMtls creates the Traefik objects needed by the mTLS fallback
## authentication (authFallback): a Secret with the client CA certificates, a
## TLSOption requesting and validating the client certificate on the ingress
## route, and a passTLSClientCert Middleware forwarding the certificate
## information to CodX in the X-Forwarded-Tls-Client-Cert-Info header.
## Requires the Traefik CRDs (Middleware, TLSOption) and the ingress to be
## managed by Traefik (ingress.ingressControllerType=traefik). All objects are
## created in the release namespace. When enabled, the chart also sets the
## traefik.ingress.kubernetes.io/router.tls.options annotation on the Ingress
## (unless already set) and appends the Middleware to
## traefik.ingress.kubernetes.io/router.middlewares.
## @param traefikMtls.enabled Create the client CA Secret, TLSOption and passTLSClientCert Middleware.
## @param traefikMtls.apiVersion API version of the Traefik CRDs: traefik.io/v1alpha1 (Traefik v3, default) or traefik.containo.us/v1alpha1 (Traefik v2).
## @param traefikMtls.existingCaSecret Existing secret with the client CA certificate (key ca.crt), e.g. the chart internal CA "<fullname>-ca-crt". When empty, a Secret is created from traefikMtls.caCertificates.
## @param traefikMtls.caCertificates PEM-encoded client CA certificate(s) for the created Secret. Use --set-file or prefer existingCaSecret.
## @param traefikMtls.annotations Annotations added to the created client CA Secret.
## @param traefikMtls.tlsOption.name Name of the TLSOption. Defaults to "<fullname>-client-mtls".
## @param traefikMtls.tlsOption.annotations Annotations for the TLSOption.
## @param traefikMtls.tlsOption.clientAuthType Client certificate policy: VerifyClientCertIfGiven (default, keeps the OIDC flow working for browsers without a client certificate), RequireAndVerifyClientCert, RequireClientCert or RequestClientCert.
## @param traefikMtls.middleware.name Name of the Middleware. Defaults to "<fullname>-passtlsclientcert".
## @param traefikMtls.middleware.annotations Annotations for the Middleware.
## @param traefikMtls.middleware.pem Also forward the full client certificate (PEM) in the X-Forwarded-Tls-Client-Cert header.
## The info section below selects the client certificate fields forwarded in the
## X-Forwarded-Tls-Client-Cert-Info header. Defaults to the subject common name,
## which is what the CodX fallback matches (authFallback.adminCns).
## @param traefikMtls.middleware.info.subject.commonName Forward the subject common name in the X-Forwarded-Tls-Client-Cert-Info header. Required by the CodX mTLS fallback.
##
traefikMtls:
  enabled: false
  apiVersion: traefik.io/v1alpha1
  existingCaSecret: ""
  caCertificates: ""
  annotations: {}
  tlsOption:
    name: ""
    annotations: {}
    clientAuthType: VerifyClientCertIfGiven
  middleware:
    name: ""
    annotations: {}
    pem: false
    info:
      subject:
        commonName: true

## @section Redis/Valkey Session Store
## Redis configures the Redis/Valkey session store.
## @param redis.host Redis hostname (host:port).
## @param redis.password Optional Redis password. Can also be set via the CODX_REDIS_PASSWORD environment variable.
## @param redis.db Redis logical database index.
## @param redis.tls Enable TLS to Redis. Automatically enabled when caFilePath is set.
## @param redis.caFilePath Path to a PEM-encoded CA certificate file used to verify the Redis TLS certificate. Typically mounted from a Kubernetes secret.
##
redis:
  host: ""
  password: ""
  db: 0
  tls: true
  caFilePath: "/tls/ca.crt"

## @section Username Slug
## Slug configures how usernames are turned into Kubernetes-safe slugs.
## @param slug.usernameField OIDC claim used as the username source.
## @param slug.maxLength Maximum length of the generated slug (Kubernetes label/name limit).
##
slug:
  usernameField: preferred_username
  maxLength: 63

## @section Inactivity Watcher
## Inactivity configures how workspace inactivity is detected and how often idle workspaces are checked.
## Workspaces are considered active when their Envoy sidecar reports active HTTPS connections:
## the CodX watcher polls the Envoy admin /stats endpoint (port 9901) of every workspace pod.
## @param inactivity.checkInterval How often the watcher polls connections and checks for idle workspaces (Go duration, e.g. 60s).
## @param inactivity.leaderElection.enabled Elect a single inactivity monitor via a Kubernetes Lease. Must be enabled with more than one CodX replica.
## @param inactivity.leaderElection.leaseName Name of the Lease object used for the election. Defaults to "<instanceName>-inactivity".
## @param inactivity.leaderElection.leaseNamespace Namespace of the Lease object. Defaults to the namespace CodX runs in.
## @param inactivity.leaderElection.leaseDuration How long a non-leader waits before taking over an unresponsive leader (Go duration).
## @param inactivity.leaderElection.renewDeadline How long the leader retries renewing the lease before giving up (Go duration).
## @param inactivity.leaderElection.retryPeriod Interval between lease (re)acquisition attempts (Go duration).
## @param inactivity.leaderElection.releaseOnCancel Release the lease immediately on graceful shutdown.
##
inactivity:
  checkInterval: 60s
  leaderElection:
    enabled: true
    # Empty values fall back to the defaults: "<instanceName>-inactivity"
    # and the namespace the CodX pod runs in.
    leaseName: ""
    leaseNamespace: ""
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
    releaseOnCancel: true

## @section Workspace Service
## WorkspaceService configures the per-user workspace Service objects.
## @param workspaceService.annotations Extra annotations to add to every workspace Service.
## @param workspaceService.ipFamilies List of IP families (e.g. IPv4, IPv6) assigned to workspace Services.
## @param workspaceService.ipFamilyPolicy Dual-stack-ness requested or required by workspace Services.
##
workspaceService:
  annotations: {}
  ipFamilies: ["IPv6", "IPv4"]
  ipFamilyPolicy: "PreferDualStack"

## @section Workspace
## Workspace configures the per-user workspace Pod objects (via the CodX ConfigMap).
##
workspace:
  ## @param workspace.envoyImage Image for the Envoy TLS termination sidecar in workspace pods
  ##
  envoyImage: envoyproxy/envoy:distroless-v1.39-latest
  ## OpenTelemetry tracing for the workspace Envoy sidecar (envoy.tracers.opentelemetry,
  ## OTLP gRPC exporter). Traces are reported to the collector at otlpEndpoint.
  ## @param workspace.tracing.enabled Enable OpenTelemetry tracing in the workspace Envoy sidecar
  ## @param workspace.tracing.otlpEndpoint OpenTelemetry collector endpoint (OTLP gRPC, host:port)
  ## @param workspace.tracing.serviceName OpenTelemetry service name reported for workspace requests
  ##
  tracing:
    enabled: false
    otlpEndpoint: ""
    serviceName: codx-workspace

## @section Tracing
## Tracing configures OpenTelemetry tracing for the CodX server itself
## (OTLP/HTTP exporter to the collector at otlpEndpoint).
## @param tracing.enabled Enable OpenTelemetry tracing for the CodX server
## @param tracing.otlpEndpoint OpenTelemetry collector endpoint (OTLP/HTTP, host:port, usually port 4318)
## @param tracing.serviceName OpenTelemetry service name reported for the CodX server
##
tracing:
  enabled: false
  otlpEndpoint: ""
  serviceName: codx
## Profile custom resources (profiles.codx.io/v1) created by the chart.
## Each entry is a map: key -> Profile spec. The key becomes the resource name.
## An empty map renders no Profile objects.
## The @param entries below document the chart's default profile; add your own
## profiles with the same structure. See docs/profile-crd.md for the full spec.
## e.g:
## profiles:
##   default:
##     title: Default
##     description: Standard code-server workspace
##     inactivityStopDelaySeconds: 1800
##     oidcGroups:
##       - doca:users
##     podSpec:
##       image: codercom/code-server:latest
##       # imagePullSecrets:
##       #   - name: my-registry-pull-secret
##       # nodeSelector:
##       #   codx.io/pool: workspaces
##       # affinity:
##       #   nodeAffinity:
##       #     requiredDuringSchedulingIgnoredDuringExecution:
##       #       nodeSelectorTerms:
##       #         - matchExpressions:
##       #             - key: codx.io/pool
##       #               operator: In
##       #               values: [workspaces]
##       # tolerations:
##       #   - key: workload
##       #     operator: Equal
##       #     value: workspaces
##       #     effect: NoSchedule
##       # codeServerReadinessProbe:
##       #   httpGet:
##       #     path: /healthz
##       #     port: 8080
##       # envoyReadinessProbe:
##       #   httpGet:
##       #     path: /ready
##       #     port: 9901
##     pvc:
##       size: 10Gi
##
## @param profiles.default.title Title of the default profile, shown in the profile picker.
## @param profiles.default.description Description of the default profile, shown in the profile picker.
## @param profiles.default.inactivityStopDelaySeconds Seconds of inactivity after which the default profile's workspaces are stopped (0 = never).
## @param profiles.default.oidcGroups [array] OIDC groups allowed to use the default profile (empty = all authenticated users).
## @param profiles.default.podSpec.image code-server image of the default profile.
## @param profiles.default.podSpec.securityContext.runAsUser User ID of the code-server container.
## @param profiles.default.podSpec.securityContext.runAsGroup Group ID of the code-server container.
## @param profiles.default.podSpec.securityContext.fsGroup Group ID of the volumes mounted by the code-server container.
## @param profiles.default.podSpec.resources.limits.cpu CPU limit of the code-server container.
## @param profiles.default.podSpec.resources.limits.memory Memory limit of the code-server container.
## @param profiles.default.podSpec.resources.requests.cpu CPU request of the code-server container.
## @param profiles.default.podSpec.resources.requests.memory Memory request of the code-server container.
## @param profiles.default.podSpec.args [array] Args of the code-server container of the default profile.
## @param profiles.default.podSpec.command [array] Command of the code-server container of the default profile.
## @param profiles.default.podSpec.codeServerReadinessProbe.exec.command [array] Exec command of the code-server readiness probe.
## @param profiles.default.pvc.size Size of the default profile's per-user PVC.
##
profiles:
  default:
    title: Default
    description: Standard code-server workspace
    inactivityStopDelaySeconds: 120
    oidcGroups: []
    podSpec:
      image: docker.io/captnbp/code-server:4.140.0
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # allowPrivilegeEscalation: false
        # readOnlyRootFilesystem: true
        # capabilities:
        #   drop:
        #     - ALL
      resources:
        limits:
          cpu: 2
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 650Mi
      args:
        - --bind-addr
        - '[::1]:8080'
        - --auth
        - none
        - /home/coder
      command:
        - /usr/bin/code-server
      codeServerReadinessProbe:
        exec:
          command:
            - sh
            - -c
            - |
              curl -f http://localhost:8080/healthz || exit 1
    pvc:
      size: 20Gi
## Network policies restricting traffic to the CodX codx and workspace pods.
## Both policies are disabled by default; enable them once the selectors match
## your cluster (ingress controller, monitoring, node CIDRs).
##
networkPolicy:

  ## Policy for the CodX codx (codx-server Deployment).
  ##
  codx:
    ## @param networkPolicy.codx.enabled Enable the NetworkPolicy for the CodX codx
    ##
    enabled: false

    ## Ingress rules for the codx.
    ##
    ingress:
      ## @param networkPolicy.codx.ingress.fromIngressController.enabled Allow traffic from the Ingress Controller
      ## @param networkPolicy.codx.ingress.fromIngressController.namespaceSelector [object] Namespace selector for the Ingress Controller
      ## @param networkPolicy.codx.ingress.fromIngressController.podSelector [object] Pod selector for the Ingress Controller
      ##
      fromIngressController:
        enabled: true
        namespaceSelector:
          kubernetes.io/metadata.name: traefik
        # For Traefik:
        podSelector:
          app.kubernetes.io/name: traefik
        # For Ingress-Nginx:
        # namespaceSelector:
        #   kubernetes.io/metadata.name: ingress-nginx
        # podSelector:
        #   app.kubernetes.io/component: controller
        #   app.kubernetes.io/instance: ingress-nginx
        #   app.kubernetes.io/name: ingress-nginx

      ## @param networkPolicy.codx.ingress.fromMonitoring.enabled Allow traffic from the monitoring namespace (requires metrics.enabled)
      ## @param networkPolicy.codx.ingress.fromMonitoring.namespaceSelector [object] Namespace selector for monitoring
      ## @param networkPolicy.codx.ingress.fromMonitoring.podSelector [object] Pod selector for monitoring
      ##
      fromMonitoring:
        enabled: true
        namespaceSelector:
          kubernetes.io/metadata.name: kube-prometheus-stack
        podSelector: {}
        # podSelector:
        #   prometheus: kube-prometheus-stack-prometheus

      ## @param networkPolicy.codx.ingress.extraIngress [array] Extra ingress rules for the codx
      ## e.g (allow kubelet probes from the node CIDR if your CNI enforces policy on host traffic):
      ## extraIngress:
      ##   - from:
      ##       - ipBlock:
      ##           cidr: 10.0.0.0/24
      ##     ports:
      ##       - protocol: TCP
      ##         port: 8443
      extraIngress: []

    ## Egress rules for the codx.
    ##
    egress:
      ## @param networkPolicy.codx.egress.toKubeAPI.enabled Allow traffic to the Kubernetes API
      ## @param networkPolicy.codx.egress.toKubeAPI.port Port of the Kubernetes API
      ## @param networkPolicy.codx.egress.toKubeAPI.cidrBlocks CIDR blocks of the Kubernetes API endpoints
      ##
      toKubeAPI:
        enabled: true
        port: 443
        cidrBlocks:
          - 0.0.0.0/0
          - ::/0

      ## @param networkPolicy.codx.egress.toWorkspaces.enabled Allow mTLS traffic to the workspace Envoy sidecars
      ## @param networkPolicy.codx.egress.toWorkspaces.port Port of the workspace Envoy sidecars
      ## The Envoy admin interface (port 9901) is also allowed so the CodX
      ## inactivity watcher can poll the connection stats.
      ##
      toWorkspaces:
        enabled: true
        port: 9443

      ## @param networkPolicy.codx.egress.toValkey.enabled Allow traffic to the Valkey pods (requires valkey.enabled)
      ## @param networkPolicy.codx.egress.toValkey.port Port of the Valkey pods
      ##
      toValkey:
        enabled: true
        port: 6379

      ## @param networkPolicy.codx.egress.toInternet.enabled Allow traffic to the Internet (OIDC issuer, ...)
      ## @param networkPolicy.codx.egress.toInternet.cidrBlocks CIDR blocks for the Internet
      ## @param networkPolicy.codx.egress.toInternet.ports [array] Internet ports to allow
      ##
      toInternet:
        enabled: true
        cidrBlocks:
          - 0.0.0.0/0
          - ::/0
        ports:
          - protocol: TCP
            port: 443

      ## @param networkPolicy.codx.egress.extraEgress [array] Extra egress rules for the codx
      ## e.g (OTLP collector):
      ## extraEgress:
      ##   - to:
      ##       - namespaceSelector:
      ##           matchLabels:
      ##             kubernetes.io/metadata.name: observability
      ##     ports:
      ##       - protocol: TCP
      ##         port: 4317
      extraEgress: []

  ## Policy for the workspace pods created at runtime by the codx.
  ##
  workspace:
    ## @param networkPolicy.workspace.enabled Enable the NetworkPolicy for the workspace pods
    ##
    enabled: true

    ## Ingress rules for the workspace pods.
    ##
    ingress:
      ## @param networkPolicy.workspace.ingress.fromCodX.enabled Allow mTLS traffic from the CodX codx
      ## @param networkPolicy.workspace.ingress.fromCodX.port Port of the workspace Envoy sidecar
      ## The Envoy admin interface (port 9901) is also allowed so the CodX
      ## inactivity watcher can poll the connection stats.
      ##
      fromCodX:
        enabled: true
        port: 9443

      ## @param networkPolicy.workspace.ingress.fromNode.enabled Allow kubelet readiness probes (code-server /healthz and Envoy /ready)
      ## @param networkPolicy.workspace.ingress.fromNode.cidrBlocks CIDR blocks the kubelet probes originate from
      ##
      fromNode:
        enabled: false
        cidrBlocks:
          - 0.0.0.0/0
          - ::/0
        # Tighten to the node CIDRs when possible, e.g:
        # cidrBlocks:
        #   - 10.0.0.201/32

      ## @param networkPolicy.workspace.ingress.extraIngress [array] Extra ingress rules for the workspace pods
      ##
      extraIngress: []

    ## Egress rules for the workspace pods.
    ##
    egress:
      ## @param networkPolicy.workspace.egress.toInternet.enabled Allow traffic to the Internet (registries, extensions, docs)
      ## @param networkPolicy.workspace.egress.toInternet.cidrBlocks CIDR blocks for the Internet
      ## @param networkPolicy.workspace.egress.toInternet.ports [array] Internet ports to allow
      ##
      toInternet:
        enabled: true
        cidrBlocks:
          - 0.0.0.0/0
          - ::/0
        ports:
          - protocol: TCP
            port: 80
          - protocol: TCP
            port: 443

      ## @param networkPolicy.workspace.egress.extraEgress [array] Extra egress rules for the workspace pods
      ## e.g (OTLP collector when workspace.tracing is enabled):
      ## extraEgress:
      ##   - to:
      ##       - namespaceSelector:
      ##           matchLabels:
      ##             kubernetes.io/metadata.name: observability
      ##     ports:
      ##       - protocol: TCP
      ##         port: 4317
      extraEgress: []
