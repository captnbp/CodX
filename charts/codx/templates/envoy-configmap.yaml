apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-envoy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: codx
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  envoy.yaml: |
    admin:
      # Bind to all interfaces so the kubelet can reach /ready from the node
      # for the readiness probe. Not exposed by the workspace Service.
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:
      listeners:
        - name: https
          address:
            socket_address:
              address: "::"
              port_value: 9443
              ipv4_compat: true
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    # TLS 1.3 only with modern ciphers
                    tls_params:
                      tls_minimum_protocol_version: TLSv1_3
                      tls_maximum_protocol_version: TLSv1_3
                    # Workspace TLS certificate (mounted from cert-manager secret)
                    tls_certificates:
                      - certificate_chain:
                          filename: /tls/tls.crt
                        private_key:
                          filename: /tls/tls.key
                    # Client certificate verification (mTLS)
                    validation_context:
                      trusted_ca:
                        filename: /tls/ca.crt
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: codx_workspace
                    http2_protocol_options: {}
                    use_remote_address: true
                    upgrade_configs:
                      - upgrade_type: websocket
{{- if and .Values.workspace.tracing.enabled .Values.workspace.tracing.otlpEndpoint }}
                    tracing:
                      http:
                        name: envoy.tracers.opentelemetry
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                          service_name: {{ .Values.workspace.tracing.serviceName | quote }}
                          grpc_service:
                            envoy_grpc:
                              cluster_name: otel_collector
                          spawn_upstream_span: true
{{- end }}
                    # Access log with timestamps (used by CodX inactivity watcher)
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: '[%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %BYTES_SENT% "%REQ(REFERER)%" "%REQ(USER-AGENT)%" rt=%DURATION%'
                    route_config:
                      name: workspace
                      virtual_hosts:
                        - name: workspace
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: code_server
                              request_headers_to_add:
                                - header:
                                    key: x-real-ip
                                    value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: code_server
          type: STATIC
          connect_timeout: 5s
          load_assignment:
            cluster_name: code_server
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8080
{{- if and .Values.workspace.tracing.enabled .Values.workspace.tracing.otlpEndpoint }}
        - name: otel_collector
          type: STRICT_DNS
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: otel_collector
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
{{- $otlpParts := splitList ":" .Values.workspace.tracing.otlpEndpoint }}
                          address: {{ $otlpParts | first | quote }}
                          port_value: {{ $otlpParts | rest | first | default "4317" | int }}
{{- end }}
