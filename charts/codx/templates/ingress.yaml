{{- if .Values.ingress.enabled }}
{{- $mtlsMiddleware := and .Values.traefikMtls.enabled (eq .Values.ingress.ingressControllerType "traefik") }}
apiVersion: {{ include "common.capabilities.ingress.apiVersion" . }}
kind: Ingress
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: codx
  {{- $ann := dict }}
  {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
  {{- $ann = include "common.tplvalues.merge" ( dict "values" ( list .Values.ingress.annotations .Values.commonAnnotations ) "context" . ) | fromYaml }}
  {{- end }}
  {{- $mwKey := "traefik.ingress.kubernetes.io/router.middlewares" }}
  {{- if and (eq .Values.ingress.ingressControllerType "traefik") (or $mtlsMiddleware .Values.ingress.extraMiddlewares) }}
  {{- $mwList := list }}
  {{- if index $ann $mwKey }}
  {{- $mwList = append $mwList (index $ann $mwKey) }}
  {{- end }}
  {{- if $mtlsMiddleware }}
  {{- $mwList = append $mwList (printf "%s-%s@kubernetescrd" (include "common.names.namespace" .) (include "codx.traefikMtls.middlewareName" .)) }}
  {{- end }}
  {{- range .Values.ingress.extraMiddlewares }}
  {{- $ref := . }}
  {{- if not (contains "@" $ref) }}
  {{- $ref = printf "%s@kubernetescrd" $ref }}
  {{- end }}
  {{- $mwList = append $mwList $ref }}
  {{- end }}
  {{- $_ := set $ann $mwKey (join "," $mwList) }}
  {{- end }}
  {{- if $mtlsMiddleware }}
  {{- if not (index $ann "traefik.ingress.kubernetes.io/router.tls.options") }}
  {{- $_ := set $ann "traefik.ingress.kubernetes.io/router.tls.options" (printf "%s-%s@kubernetescrd" (include "common.names.namespace" .) (include "codx.traefikMtls.tlsOptionName" .)) }}
  {{- end }}
  {{- end }}
  {{- if $ann }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $ann "context" $) | nindent 4 }}
  {{- else }}
  annotations: {}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hostname }}
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          {{- if .Values.ingress.extraPaths }}
          {{- toYaml .Values.ingress.extraPaths | nindent 10 }}
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            {{- if .Values.tls.enabled }}
            backend: {{- include "common.ingress.backend" (dict "serviceName" (include "common.names.fullname" .) "servicePort" "https" "context" $)  | nindent 14 }}
            {{- else }}
            backend: {{- include "common.ingress.backend" (dict "serviceName" (include "common.names.fullname" .) "servicePort" "http" "context" $)  | nindent 14 }}
            {{- end }}
    {{- end }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ .name | quote }}
      http:
        paths:
          - path: {{ default "/" .path }}
            pathType: {{ default "ImplementationSpecific" .pathType }}
            {{- if .Values.tls.enabled }}
            backend: {{- include "common.ingress.backend" (dict "serviceName" (include "common.names.fullname" $) "servicePort" "https" "context" $) | nindent 14 }}
            {{- else }}
            backend: {{- include "common.ingress.backend" (dict "serviceName" (include "common.names.fullname" .) "servicePort" "http" "context" $)  | nindent 14 }}
            {{- end }}
    {{- end }}
    {{- if .Values.ingress.extraRules }}
    {{- include "common.tplvalues.render" (dict "value" .Values.ingress.extraRules "context" $) | nindent 4 }}
    {{- end }}
  {{- if or (and .Values.ingress.tls (or (include "common.ingress.certManagerRequest" ( dict "annotations" .Values.ingress.annotations )) .Values.ingress.selfSigned)) .Values.ingress.extraTls }}
  tls:
    {{- if and .Values.ingress.tls (or (include "common.ingress.certManagerRequest" ( dict "annotations" .Values.ingress.annotations )) .Values.ingress.selfSigned) }}
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
      secretName: {{ printf "%s-tls" .Values.ingress.hostname }}
    {{- end }}
    {{- if .Values.ingress.extraTls }}
    {{- include "common.tplvalues.render" (dict "value" .Values.ingress.extraTls "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}