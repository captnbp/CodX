run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

linters-settings:
  errcheck:
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - fmt.Fprint
      - fmt.Fprintln
      - fmt.Fprintf
